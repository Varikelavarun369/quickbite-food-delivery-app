<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quick Bite | Add Restaurant</title>

    <link rel="stylesheet"
          href="../css/addrestaurant.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">

        Quick Bite Admin

    </div>

    <ul class="nav-links">

        <li>
            <a href="admin-dashboard.html">
                Dashboard
            </a>
        </li>

        <li>
            <a class="active"
               href="addrestaurant.html">
                Add Restaurant
            </a>
        </li>

        <li>
            <a href="addfooditem.html">
                Add Food Item
            </a>
        </li>

        <li>
            <a href="orders-admin.html">
                Manage Orders
            </a>
        </li>

        <li>
            <a href="#"
               id="logoutBtn">
                Logout
            </a>
        </li>

    </ul>

</nav>

<section class="page-header">

    <h1>
        Add New Restaurant
    </h1>

    <p>
        Create restaurant listings for customers
    </p>

</section>

<div class="container">

    <div class="form-box">

        <div class="form-icon">
            🍽
        </div>

        <h2>
            Restaurant Details
        </h2>

        <form id="restaurantForm">

            <div class="input-group">

                <label>
                    Restaurant Name
                </label>

                <input type="text"
                       id="name"
                       placeholder="Enter restaurant name"
                       required>

            </div>

            <div class="input-group">

                <label>
                    Address
                </label>

                <input type="text"
                       id="address"
                       placeholder="Enter restaurant address"
                       required>

            </div>

            <div class="input-group">

                <label>
                    Cuisine Type
                </label>

                <input type="text"
                       id="cuisineType"
                       placeholder="Example: Indian, Chinese"
                       required>

            </div>

            <div class="input-group">

                <label>
                    Phone Number
                </label>

                <input type="text"
                       id="phoneNumber"
                       placeholder="Enter contact number"
                       required>

            </div>

            <button type="submit">

                Add Restaurant

            </button>

        </form>

        <div id="message"></div>

    </div>

</div>

<script src="../js/addrestaurant.js"></script>

</body>

</html>
